
name: Test ve GitHub Pages yayını

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matematik testleri
        run: node --test tests/calculator.test.js
      - name: Sayfa ve bağlantı testleri
        run: python -m unittest discover -s tests -v
      - name: Sayfaları, canonical ve sitemap üret
        run: python scripts/build.py
      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5
      - name: Siteyi dağıtıma hazırla
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
